services:
  postgres:
    image: postgres:17-alpine
    environment:
      POSTGRES_DB: xiaohai_dev
      POSTGRES_PASSWORD: xiaohai_dev_only
      POSTGRES_USER: xiaohai
    healthcheck:
      test: ['CMD-SHELL', 'pg_isready -U xiaohai -d xiaohai_dev']
      interval: 5s
      timeout: 5s
      retries: 10
    ports:
      - '127.0.0.1:5432:5432'
    volumes:
      - xiaohai_postgres_data:/var/lib/postgresql/data

volumes:
  xiaohai_postgres_data:
