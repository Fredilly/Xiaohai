name: Package production web (no deployment)

on:
  workflow_dispatch:

permissions:
  contents: read

concurrency:
  group: production-web-package-${{ github.ref }}
  cancel-in-progress: false

jobs:
  package:
    # Only the designated integration branch or protected main can be packaged.
    # This job never accesses the ECS, production secrets or any live database.
    if: github.ref == 'refs/heads/main' || github.ref == 'refs/heads/codex/local-release-integration'
    runs-on: ubuntu-latest
    timeout-minutes: 30
    permissions:
      contents: read
      packages: write
    steps:
      - uses: actions/checkout@v4
        with:
          ref: ${{ github.sha }}
      - name: Pin exact clean source revision
        env:
          EXPECTED_REVISION: ${{ github.sha }}
        run: |
          set -euo pipefail
          [[ "$EXPECTED_REVISION" =~ ^[0-9a-f]{40}$ ]]
          test "$(git rev-parse HEAD)" = "$EXPECTED_REVISION"
          test -z "$(git status --porcelain)"
      - uses: docker/setup-buildx-action@v3
      - uses: docker/login-action@v3
        with:
          registry: ghcr.io
          username: ${{ github.actor }}
          password: ${{ secrets.GITHUB_TOKEN }}
      - name: Build and push static Caddy runtime on GitHub runner
        id: image
        uses: docker/build-push-action@v6
        with:
          context: .
          file: deploy/Dockerfile.production-web
          push: true
          tags: ghcr.io/fredilly/xiaohai-production-web:${{ github.sha }}
      - name: Verify immutable image digest
        env:
          IMAGE_DIGEST: ${{ steps.image.outputs.digest }}
        run: |
          set -euo pipefail
          [[ "$IMAGE_DIGEST" =~ ^sha256:[0-9a-f]{64}$ ]]
          echo 'Production web image packaged; no servers or databases were touched.'
