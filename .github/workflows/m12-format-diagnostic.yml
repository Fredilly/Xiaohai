name: M12 Format Diagnostic

on:
  push:
    branches: [intern/m12-pangzhu-stores]

permissions:
  contents: write

jobs:
  format:
    runs-on: ubuntu-latest
    timeout-minutes: 10
    steps:
      - uses: actions/checkout@v4
      - uses: pnpm/action-setup@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: pnpm
      - run: pnpm install --frozen-lockfile
      - name: Format M12 files
        shell: bash
        run: |
          files=(
            apps/api/src/stores/store-routes.ts
            apps/api/src/stores/store-service.ts
            apps/api/test/store-network.integration.test.ts
            apps/miniapp/pages/global/global.ts
            packages/contracts/src/stores.test.ts
            packages/contracts/src/stores.ts
            packages/db/src/store-schema.ts
          )
          pnpm exec prettier --write "${files[@]}"
          git config user.name github-actions[bot]
          git config user.email 41898282+github-actions[bot]@users.noreply.github.com
          git add "${files[@]}"
          if git diff --cached --quiet; then
            echo "No formatting changes needed."
          else
            git commit -m "style(m12): apply repository Prettier formatting"
            git push origin HEAD:intern/m12-pangzhu-stores
          fi
