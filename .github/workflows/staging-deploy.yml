name: Deploy staging (after CI)
on:
  workflow_run:
    workflows: ['CI']
    types: [completed]
    branches: [main]
permissions:
  contents: read
concurrency:
  group: deploy-staging
  cancel-in-progress: false
jobs:
  eligibility:
    permissions:
      contents: read
      deployments: read
    if: >-
      ${{ github.event_name == 'workflow_run' &&
          github.event.workflow_run.conclusion == 'success' &&
          github.event.workflow_run.event == 'push' &&
          github.event.workflow_run.head_branch == 'main' &&
          github.event.workflow_run.head_repository.full_name == github.repository &&
          vars.STAGING_READY == 'true' }}
    runs-on: ubuntu-latest
    outputs:
      current: ${{ steps.latest.outputs.current }}
      backend_changed: ${{ steps.detect.outputs.backend_changed }}
    steps:
      - uses: actions/checkout@v4
        with:
          ref: ${{ github.event.workflow_run.head_sha }}
          fetch-depth: 0
      - name: Confirm CI commit is still latest main
        id: latest
        env:
          STAGING_CI_SHA: ${{ github.event.workflow_run.head_sha }}
        run: bash scripts/staging-check-main.sh
      - name: Resolve last genuinely successful backend deployment
        id: baseline
        if: steps.latest.outputs.current == 'true'
        uses: actions/github-script@v7
        env:
          BOOTSTRAP_SHA: ${{ vars.STAGING_VERIFIED_BASELINE_SHA }}
          BOOTSTRAP_API_DIGEST: ${{ vars.STAGING_VERIFIED_BASELINE_API_DIGEST }}
          BOOTSTRAP_WORKER_DIGEST: ${{ vars.STAGING_VERIFIED_BASELINE_WORKER_DIGEST }}
        with:
          script: |
            const { owner, repo } = context.repo;
            const shaPattern = /^[0-9a-f]{40}$/;
            const digestPattern = /^sha256:[0-9a-f]{64}$/;
            // Deployment markers are created ONLY after every deploy/post-health gate passes.
            const { data: records } = await github.rest.repos.listDeployments({
              owner, repo, environment: 'staging-backend-success', per_page: 100
            });
            let selected;
            for (const entry of records) {
              const { data: statuses } = await github.rest.repos.listDeploymentStatuses({
                owner, repo, deployment_id: entry.id, per_page: 1
              });
              if (statuses[0]?.state !== 'success') continue;
              const data = typeof entry.payload === 'string'
                ? JSON.parse(entry.payload) : entry.payload;
              selected = {
                sha: entry.sha,
                api: data?.api_digest,
                worker: data?.worker_digest,
                source: `deployment:${entry.id}`
              };
              break;
            }
            if (!selected && records.length === 0) {
              selected = {
                sha: process.env.BOOTSTRAP_SHA,
                api: process.env.BOOTSTRAP_API_DIGEST,
                worker: process.env.BOOTSTRAP_WORKER_DIGEST,
                source: 'one-time-owner-verified-bootstrap'
              };
            }
            if (!selected || !shaPattern.test(selected.sha) ||
                !digestPattern.test(selected.api) || !digestPattern.test(selected.worker)) {
              throw new Error(
                'No verified successful backend deployment baseline and digests. ' +
                'Require one-time owner-verified baseline variables; do not build or deploy.'
              );
            }
            core.info(`STAGING_BACKEND_BASELINE source=${selected.source} sha=${selected.sha} api=${selected.api} worker=${selected.worker}`);
            core.setOutput('sha', selected.sha);
            core.setOutput('api_digest', selected.api);
            core.setOutput('worker_digest', selected.worker);
      - name: Detect backend-impacting changes since last success
        id: detect
        if: steps.latest.outputs.current == 'true'
        env:
          STAGING_CI_SHA: ${{ github.event.workflow_run.head_sha }}
          STAGING_BACKEND_BASE_SHA: ${{ steps.baseline.outputs.sha }}
          STAGING_BACKEND_API_DIGEST: ${{ steps.baseline.outputs.api_digest }}
          STAGING_BACKEND_WORKER_DIGEST: ${{ steps.baseline.outputs.worker_digest }}
        run: node scripts/staging-backend-gate.mjs
  build:
    needs: eligibility
    if: needs.eligibility.outputs.current == 'true' && needs.eligibility.outputs.backend_changed == 'true'
    permissions:
      contents: read
      packages: write
    runs-on: ubuntu-latest
    strategy:
      matrix:
        service: [api, worker]
    steps:
      - uses: actions/checkout@v4
        with:
          ref: ${{ github.event.workflow_run.head_sha }}
      - uses: docker/setup-buildx-action@v3
      - uses: docker/login-action@v3
        with:
          registry: ghcr.io
          username: ${{ github.actor }}
          password: ${{ secrets.GITHUB_TOKEN }}
      - uses: docker/build-push-action@v6
        id: image
        with:
          context: .
          file: deploy/Dockerfile
          push: true
          build-args: SERVICE=${{ matrix.service }}
          tags: ghcr.io/fredilly/xiaohai-${{ matrix.service }}:${{ github.event.workflow_run.head_sha }}
      - name: Validate pushed image digest
        env:
          IMAGE_DIGEST: ${{ steps.image.outputs.digest }}
          IMAGE_SERVICE: ${{ matrix.service }}
        run: |
          set -euo pipefail
          [[ "$IMAGE_DIGEST" =~ ^sha256:[0-9a-f]{64}$ ]] || { echo '::error::Invalid pushed digest'; exit 1; }
          mkdir -p "$RUNNER_TEMP/backend-digests"
          printf '%s\n' "$IMAGE_DIGEST" > "$RUNNER_TEMP/backend-digests/$IMAGE_SERVICE.digest"
      - uses: actions/upload-artifact@v4
        with:
          name: staging-backend-digest-${{ matrix.service }}
          path: ${{ runner.temp }}/backend-digests/${{ matrix.service }}.digest
          if-no-files-found: error
  deploy:
    needs: [eligibility, build]
    if: needs.eligibility.outputs.current == 'true' && needs.eligibility.outputs.backend_changed == 'true'
    permissions:
      contents: read
      packages: read
    runs-on: ubuntu-latest
    environment: staging
    outputs:
      deployed: ${{ steps.deploy-images.outputs.deployed }}
    steps:
      - uses: actions/checkout@v4
        with:
          ref: ${{ github.event.workflow_run.head_sha }}
      # Recheck after builds/queueing before making any staging connection.
      - name: Recheck latest main before staging SSH
        id: latest
        env:
          STAGING_CI_SHA: ${{ github.event.workflow_run.head_sha }}
        run: bash scripts/staging-check-main.sh
      - name: Install SSH key
        if: steps.latest.outputs.current == 'true'
        env:
          SSH_KEY: ${{ secrets.STAGING_SSH_PRIVATE_KEY }}
          SSH_HOST: ${{ secrets.STAGING_SSH_HOST }}
          SSH_USER: ${{ secrets.STAGING_SSH_USER }}
          SSH_KNOWN_HOSTS: ${{ secrets.STAGING_SSH_KNOWN_HOSTS }}
        run: |
          set -eu
          install -m 700 -d ~/.ssh
          printf '%s\n' "$SSH_KEY" > ~/.ssh/id_ed25519
          chmod 600 ~/.ssh/id_ed25519
          printf '%s\n' "$SSH_KNOWN_HOSTS" > ~/.ssh/known_hosts
          test -n "$SSH_USER"
      # This workflow changes application images only; schema/data writes require
      # a separate DBA-approved migration or seed operation (Issue #169).
      # No image removal is wired here; maintenance scripts default to dry-run.
      - name: Deploy exact CI-verified revision with disk/inode capacity gate
        id: deploy-images
        if: steps.latest.outputs.current == 'true'
        env:
          HOST: ${{ secrets.STAGING_SSH_HOST }}
          USER: ${{ secrets.STAGING_SSH_USER }}
          GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}
          REVISION: ${{ github.event.workflow_run.head_sha }}
        run: |
          set -eu
          ssh "$USER@$HOST" 'mkdir -p ~/xiaohai-deploy'
          scp deploy/staging.compose.yml deploy/Caddyfile scripts/staging-disk-gate.sh scripts/staging-image-retention.sh scripts/staging-remote-deploy.sh "$USER@$HOST:~/xiaohai-deploy/"
          # Send the token through stdin only; the remote script first acquires
          # the shared lock and passes the capacity gate, then uses isolated
          # Docker credentials and an EXIT trap for success/failure cleanup.
          printf '%s' "$GH_TOKEN" | ssh "$USER@$HOST" "cd ~/xiaohai-deploy && REVISION='$REVISION' bash staging-remote-deploy.sh"
          curl --fail --retry 8 --retry-delay 5 --retry-connrefused "https://staging-api.pamboo.asia/health"
          curl --fail --retry 8 --retry-delay 5 --retry-connrefused "https://staging-api.pamboo.asia/ready"
          ssh "$USER@$HOST" 'cd ~/xiaohai-deploy && bash staging-disk-gate.sh post'
          echo 'deployed=true' >> "$GITHUB_OUTPUT"
      - name: Dry-run retention audit (explicitly enabled; no deletes)
        if: steps.latest.outputs.current == 'true' && vars.STAGING_RETENTION_PLAN_READY == 'true'
        env:
          HOST: ${{ secrets.STAGING_SSH_HOST }}
          USER: ${{ secrets.STAGING_SSH_USER }}
          REVISION: ${{ github.event.workflow_run.head_sha }}
          ROLLBACKS: ${{ vars.STAGING_ROLLBACK_REVISIONS }}
          EXTRA_PROTECTED: ${{ vars.STAGING_EXTRA_PROTECTED_REVISION }}
          CONFIG_COVERAGE: ${{ vars.STAGING_CONFIG_COVERAGE_CONFIRMED }}
        run: |
          set -euo pipefail
          if [[ ! "$ROLLBACKS" =~ ^[0-9a-f]{40}[[:space:]][0-9a-f]{40}$ ]]; then
            echo '::error::Expected exactly two explicit verified rollback revisions.'
            exit 1
          fi
          if [[ ! "$EXTRA_PROTECTED" =~ ^[0-9a-f]{40}$ ]]; then
            echo '::error::An explicit third historically protected revision is required.'
            exit 1
          fi
          if [[ " $ROLLBACKS " == *" $EXTRA_PROTECTED "* || "$EXTRA_PROTECTED" == "$REVISION" ]]; then
            echo '::error::Extra protected revision must be distinct from the current/two rollback SHAs.'
            exit 1
          fi
          if [[ "$CONFIG_COVERAGE" != true ]]; then
            echo '::error::Deployment configuration scan coverage has not been independently verified.'
            exit 1
          fi
          ssh "$USER@$HOST" "cd ~/xiaohai-deploy && STAGING_CONFIG_COVERAGE_CONFIRMED=true STAGING_CURRENT_REVISION='$REVISION' STAGING_ROLLBACK_REVISIONS='$ROLLBACKS' STAGING_EXTRA_PROTECTED_REVISION='$EXTRA_PROTECTED' bash staging-image-retention.sh --dry-run"

  # This job runs ONLY after a genuinely successful full staging deploy.
  # The separately approved opt-in variable is default OFF; it produces a
  # read-only exact-ID approval proposal, NEVER calls image rm or --execute.
  retention-plan:
    needs: [eligibility, deploy]
    permissions:
      contents: read
    if: >-
      ${{ needs.eligibility.outputs.current == 'true' &&
          needs.deploy.result == 'success' &&
          needs.deploy.outputs.deployed == 'true' &&
          vars.STAGING_RETENTION_PLAN_GENERATION_ENABLED == 'true' }}
    runs-on: ubuntu-latest
    environment: staging
    steps:
      - uses: actions/checkout@v4
        with:
          ref: ${{ github.event.workflow_run.head_sha }}
      - name: Recheck latest main before optional plan-only SSH
        id: latest
        env:
          STAGING_CI_SHA: ${{ github.event.workflow_run.head_sha }}
        run: bash scripts/staging-check-main.sh
      - name: Generate exact-ID retention proposal (read-only, no deletion)
        if: steps.latest.outputs.current == 'true'
        env:
          HOST: ${{ secrets.STAGING_SSH_HOST }}
          USER: ${{ secrets.STAGING_SSH_USER }}
          SSH_KEY: ${{ secrets.STAGING_SSH_PRIVATE_KEY }}
          SSH_KNOWN_HOSTS: ${{ secrets.STAGING_SSH_KNOWN_HOSTS }}
          REVISION: ${{ github.event.workflow_run.head_sha }}
          ROLLBACKS: ${{ vars.STAGING_ROLLBACK_REVISIONS }}
          EXTRA_PROTECTED: ${{ vars.STAGING_EXTRA_PROTECTED_REVISION }}
          CONFIG_COVERAGE: ${{ vars.STAGING_CONFIG_COVERAGE_CONFIRMED }}
        run: |
          set -euo pipefail
          [[ "$REVISION" =~ ^[0-9a-f]{40}$ ]] || exit 1
          [[ "$ROLLBACKS" =~ ^[0-9a-f]{40}[[:space:]][0-9a-f]{40}$ ]] || exit 1
          [[ "$EXTRA_PROTECTED" =~ ^[0-9a-f]{40}$ ]] || exit 1
          [[ "$CONFIG_COVERAGE" == true ]] || exit 1
          test -n "$USER"
          install -m 700 -d ~/.ssh
          printf '%s\n' "$SSH_KEY" > ~/.ssh/id_ed25519
          chmod 600 ~/.ssh/id_ed25519
          printf '%s\n' "$SSH_KNOWN_HOSTS" > ~/.ssh/known_hosts
          ssh "$USER@$HOST" "cd ~/xiaohai-deploy && STAGING_CONFIG_COVERAGE_CONFIRMED=true STAGING_CURRENT_REVISION='$REVISION' STAGING_ROLLBACK_REVISIONS='$ROLLBACKS' STAGING_EXTRA_PROTECTED_REVISION='$EXTRA_PROTECTED' bash staging-image-retention.sh --plan" | tee "$RUNNER_TEMP/staging-retention-proposal.txt"
      - name: Publish proposed exact IDs for independent owner approval
        if: steps.latest.outputs.current == 'true'
        uses: actions/upload-artifact@v4
        with:
          name: staging-retention-proposal-${{ github.event.workflow_run.head_sha }}
          path: ${{ runner.temp }}/staging-retention-proposal.txt
          retention-days: 14
          if-no-files-found: error

  # The successful backend baseline advances only after completed health,
  # post-disk and optional audit gates. No staging mutation or image deletion.
  record-backend-success:
    needs: [eligibility, deploy, retention-plan]
    if: >-
      ${{ always() &&
          needs.eligibility.outputs.backend_changed == 'true' &&
          needs.deploy.result == 'success' &&
          needs.deploy.outputs.deployed == 'true' &&
          (needs.retention-plan.result == 'success' || needs.retention-plan.result == 'skipped') }}
    permissions:
      actions: read
      contents: read
      deployments: write
    runs-on: ubuntu-latest
    steps:
      - uses: actions/download-artifact@v4
        with:
          pattern: staging-backend-digest-*
          merge-multiple: true
          path: ${{ runner.temp }}/backend-digests
      - name: Record verified successful staging backend release
        uses: actions/github-script@v7
        env:
          STAGING_CI_SHA: ${{ github.event.workflow_run.head_sha }}
          STAGING_CI_RUN_ID: ${{ github.event.workflow_run.id }}
          STAGING_DIGEST_DIR: ${{ runner.temp }}/backend-digests
        with:
          script: |
            const fs = require('node:fs');
            const path = require('node:path');
            const sha = process.env.STAGING_CI_SHA;
            const digestPattern = /^sha256:[0-9a-f]{64}$/;
            if (!/^[0-9a-f]{40}$/.test(sha)) throw new Error('Invalid backend CI SHA');
            const digest = (service) => fs.readFileSync(
              path.join(process.env.STAGING_DIGEST_DIR, `${service}.digest`), 'utf8'
            ).trim();
            const api = digest('api');
            const worker = digest('worker');
            if (!digestPattern.test(api) || !digestPattern.test(worker)) {
              throw new Error('Refuse to mark success without both pushed image digests');
            }
            const { owner, repo } = context.repo;
            const deployment = await github.rest.repos.createDeployment({
              owner, repo, ref: sha, environment: 'staging-backend-success',
              auto_merge: false, required_contexts: [],
              transient_environment: false, production_environment: false,
              description: 'Verified post-health and post-disk backend staging deployment',
              payload: {
                api_digest: api, worker_digest: worker,
                ci_run_id: Number(process.env.STAGING_CI_RUN_ID)
              }
            });
            await github.rest.repos.createDeploymentStatus({
              owner, repo, deployment_id: deployment.data.id, state: 'success',
              description: 'Backend deployment verified; new compare baseline',
              log_url: `https://github.com/${owner}/${repo}/actions/runs/${context.runId}`
            });
            core.info(`STAGING_BACKEND_SUCCESS sha=${sha} api=${api} worker=${worker}`);
