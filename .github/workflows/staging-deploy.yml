name: Deploy staging (after CI)
on:
  workflow_run:
    workflows: ['CI']
    types: [completed]
    branches: [main]
permissions:
  contents: read
  packages: write
concurrency:
  group: deploy-staging
  cancel-in-progress: false
jobs:
  build:
    if: >-
      ${{ github.event_name == 'workflow_run' &&
          github.event.workflow_run.conclusion == 'success' &&
          github.event.workflow_run.event == 'push' &&
          github.event.workflow_run.head_branch == 'main' &&
          github.event.workflow_run.head_repository.full_name == github.repository &&
          vars.STAGING_READY == 'true' }}
    runs-on: ubuntu-latest
    strategy:
      matrix:
        service: [api, worker]
    steps:
      - uses: actions/checkout@v4
        with:
          ref: ${{ github.event.workflow_run.head_sha }}
      - uses: docker/setup-buildx-action@v3
      - uses: docker/login-action@v3
        with:
          registry: ghcr.io
          username: ${{ github.actor }}
          password: ${{ secrets.GITHUB_TOKEN }}
      - uses: docker/build-push-action@v6
        with:
          context: .
          file: deploy/Dockerfile
          push: true
          build-args: SERVICE=${{ matrix.service }}
          tags: ghcr.io/fredilly/xiaohai-${{ matrix.service }}:${{ github.event.workflow_run.head_sha }}
  deploy:
    needs: build
    runs-on: ubuntu-latest
    environment: staging
    steps:
      - uses: actions/checkout@v4
        with:
          ref: ${{ github.event.workflow_run.head_sha }}
      - name: Install SSH key
        env:
          SSH_KEY: ${{ secrets.STAGING_SSH_PRIVATE_KEY }}
          SSH_HOST: ${{ secrets.STAGING_SSH_HOST }}
          SSH_USER: ${{ secrets.STAGING_SSH_USER }}
          SSH_KNOWN_HOSTS: ${{ secrets.STAGING_SSH_KNOWN_HOSTS }}
        run: |
          set -eu
          install -m 700 -d ~/.ssh
          printf '%s\n' "$SSH_KEY" > ~/.ssh/id_ed25519
          chmod 600 ~/.ssh/id_ed25519
          printf '%s\n' "$SSH_KNOWN_HOSTS" > ~/.ssh/known_hosts
          test -n "$SSH_USER"
      # This workflow changes application images only; schema/data writes require
      # a separate DBA-approved migration or seed operation (Issue #169).
      # No image removal is wired here; maintenance scripts default to dry-run.
      - name: Deploy exact CI-verified revision with disk/inode capacity gate
        env:
          HOST: ${{ secrets.STAGING_SSH_HOST }}
          USER: ${{ secrets.STAGING_SSH_USER }}
          GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}
          REVISION: ${{ github.event.workflow_run.head_sha }}
        run: |
          set -eu
          ssh "$USER@$HOST" 'mkdir -p ~/xiaohai-deploy'
          scp deploy/staging.compose.yml deploy/Caddyfile scripts/staging-disk-gate.sh scripts/staging-image-retention.sh "$USER@$HOST:~/xiaohai-deploy/"
          printf '%s' "$GH_TOKEN" | ssh "$USER@$HOST" 'docker login ghcr.io -u xiaohai-deploy --password-stdin'
          # A shared flock prevents competing live deployments/retention. Gate
          # MUST pass before writing revision.env or starting any Docker pull.
          ssh "$USER@$HOST" "cd ~/xiaohai-deploy && test -f staging.env && exec 9>/tmp/xiaohai-staging-deploy.lock && flock -n 9 && bash staging-disk-gate.sh pre && printf 'REVISION=%s\\n' '$REVISION' > revision.env && docker compose --env-file staging.env --env-file revision.env -f staging.compose.yml pull && docker compose --env-file staging.env --env-file revision.env -f staging.compose.yml up -d --remove-orphans && docker logout ghcr.io"
          curl --fail --retry 8 --retry-delay 5 --retry-connrefused "https://staging-api.pamboo.asia/health"
          curl --fail --retry 8 --retry-delay 5 --retry-connrefused "https://staging-api.pamboo.asia/ready"
          ssh "$USER@$HOST" 'cd ~/xiaohai-deploy && bash staging-disk-gate.sh post'
      - name: Dry-run retention audit (explicitly enabled; no deletes)
        if: vars.STAGING_RETENTION_PLAN_READY == 'true'
        env:
          HOST: ${{ secrets.STAGING_SSH_HOST }}
          USER: ${{ secrets.STAGING_SSH_USER }}
          REVISION: ${{ github.event.workflow_run.head_sha }}
          ROLLBACKS: ${{ vars.STAGING_ROLLBACK_REVISIONS }}
        run: |
          set -euo pipefail
          if [[ ! "$ROLLBACKS" =~ ^[0-9a-f]{40}[[:space:]][0-9a-f]{40}$ ]]; then
            echo '::error::Expected exactly two explicit verified rollback revisions.'
            exit 1
          fi
          ssh "$USER@$HOST" "cd ~/xiaohai-deploy && STAGING_CURRENT_REVISION='$REVISION' STAGING_ROLLBACK_REVISIONS='$ROLLBACKS' bash staging-image-retention.sh --dry-run"
