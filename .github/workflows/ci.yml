name: CI

on:
  pull_request:
  push:
    branches: [main]

permissions:
  contents: read

concurrency:
  group: ci-${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: true

jobs:
  verify:
    runs-on: ubuntu-latest
    timeout-minutes: 20
    services:
      postgres:
        image: postgres:17-alpine
        env:
          POSTGRES_DB: xiaohai_test
          POSTGRES_PASSWORD: postgres
          POSTGRES_USER: postgres
        ports:
          - 5432:5432
        options: >-
          --health-cmd "pg_isready -U postgres -d xiaohai_test"
          --health-interval 5s
          --health-timeout 5s
          --health-retries 10
    env:
      APP_ENV: dev
      DATABASE_URL: postgresql://postgres:postgres@127.0.0.1:5432/xiaohai_test
      NODE_ENV: test
    steps:
      - uses: actions/checkout@v4
      - uses: pnpm/action-setup@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: pnpm
      - run: pnpm install --frozen-lockfile
      - name: Print M2-3 Prettier diff
        run: |
          pnpm exec prettier --write apps/api/test/staff-authorization.test.ts apps/api/test/staff-authorization.integration.test.ts
          git diff -- apps/api/test/staff-authorization.test.ts apps/api/test/staff-authorization.integration.test.ts
          exit 1
      - run: pnpm check
      - run: pnpm --filter @xiaohai/db db:check
      - run: pnpm --filter @xiaohai/db db:migrate
      - run: pnpm test:integration
      - run: pnpm test:e2e
