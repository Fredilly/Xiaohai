name: CI

on:
  pull_request:
  push:
    branches: [main]

permissions:
  contents: read

concurrency:
  group: ci-${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: true

jobs:
  changes:
    name: classify changes
    runs-on: ubuntu-latest
    outputs:
      risky: ${{ steps.classify.outputs.risky }}
      deps: ${{ steps.classify.outputs.deps }}
      schema: ${{ steps.classify.outputs.schema }}
      migration: ${{ steps.classify.outputs.migration }}
    steps:
      - uses: actions/checkout@v4
        with:
          fetch-depth: 0
      - id: classify
        env:
          BASE_SHA: ${{ github.event.pull_request.base.sha || github.event.before }}
        run: |
          set -euo pipefail
          base="$BASE_SHA"
          if [ -z "$base" ] || [ "$base" = "0000000000000000000000000000000000000000" ]; then
            base="$(git rev-parse HEAD^)"
          fi
          files="$(git diff --name-only "$base"...HEAD)"
          printf '%s\n' "$files"

          risky=false
          deps=false
          schema=false
          migration=false

          if printf '%s\n' "$files" | grep -Eq '^(apps/api/|apps/worker/|packages/(db|domain|contracts|validation|config)/|\.github/workflows/)'; then
            risky=true
          fi
          if printf '%s\n' "$files" | grep -Eq '(^|/)(package\.json|pnpm-lock\.yaml)$'; then
            deps=true
          fi
          if printf '%s\n' "$files" | grep -Eq '^packages/db/src/([^/]*-schema|schema)\.ts$'; then
            schema=true
          fi
          if printf '%s\n' "$files" | grep -Eq '^packages/db/migrations/'; then
            migration=true
          fi

          echo "risky=$risky" >> "$GITHUB_OUTPUT"
          echo "deps=$deps" >> "$GITHUB_OUTPUT"
          echo "schema=$schema" >> "$GITHUB_OUTPUT"
          echo "migration=$migration" >> "$GITHUB_OUTPUT"

  fast:
    name: fast checks
    needs: changes
    runs-on: ubuntu-latest
    timeout-minutes: 12
    steps:
      - uses: actions/checkout@v4
      - uses: pnpm/action-setup@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: pnpm
      - run: pnpm install --frozen-lockfile
      - name: Workspace, Mini Program and secret checks
        run: pnpm check:workspace && pnpm check:miniapp && pnpm check:secrets
      - name: Format, lint and typecheck
        run: pnpm format:check && pnpm lint && pnpm typecheck
      - name: Unit tests
        run: pnpm test
      - name: Build
        run: pnpm build
      - name: Verify built workspace imports with plain Node
        run: pnpm --filter @xiaohai/api exec node -e "Promise.all([import('@xiaohai/config'), import('@xiaohai/contracts'), import('@xiaohai/db'), import('@xiaohai/domain')])"
      - name: High severity production dependency audit
        if: needs.changes.outputs.deps == 'true'
        run: pnpm audit --prod --audit-level high

  migration-guard:
    name: migration guard
    needs: changes
    runs-on: ubuntu-latest
    timeout-minutes: 2
    steps:
      - name: Require migration for schema changes
        if: needs.changes.outputs.schema == 'true' && needs.changes.outputs.migration != 'true'
        run: |
          echo "::error::Database schema changed without a Drizzle migration under packages/db/migrations/."
          exit 1
      - name: No migration mismatch
        if: needs.changes.outputs.schema != 'true' || needs.changes.outputs.migration == 'true'
        run: echo "Migration guard passed."

  critical:
    name: critical integration
    needs: changes
    if: needs.changes.outputs.risky == 'true'
    runs-on: ubuntu-latest
    timeout-minutes: 15
    services:
      postgres:
        image: postgres:17-alpine
        env:
          POSTGRES_DB: xiaohai_test
          POSTGRES_PASSWORD: postgres
          POSTGRES_USER: postgres
        ports:
          - 5432:5432
        options: >-
          --health-cmd "pg_isready -U postgres -d xiaohai_test"
          --health-interval 5s
          --health-timeout 5s
          --health-retries 10
      redis:
        image: redis:7.4-alpine
        ports:
          - 6379:6379
        options: >-
          --health-cmd "redis-cli ping"
          --health-interval 5s
          --health-timeout 5s
          --health-retries 10
    env:
      APP_ENV: dev
      DATABASE_URL: postgresql://postgres:postgres@127.0.0.1:5432/xiaohai_test
      NODE_ENV: test
      REDIS_URL: redis://127.0.0.1:6379
      AI_PROVIDER: MOCK
      AI_MOCK_ENABLED: 'true'
    steps:
      - uses: actions/checkout@v4
      - uses: pnpm/action-setup@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: pnpm
      - run: pnpm install --frozen-lockfile
      - name: Build DB runtime dependencies
        run: |
          pnpm --filter @xiaohai/validation build
          pnpm --filter @xiaohai/config build
      - run: pnpm --filter @xiaohai/db db:check
      - run: pnpm --filter @xiaohai/db db:migrate
      - name: Scanner PostgreSQL integration (disposable DB)
        run: pnpm --filter @xiaohai/db test:reliability-integration
      - run: pnpm test:integration
      - run: pnpm test:e2e
      - name: Restore drill on disposable test database
        run: |
          docker run --rm --network host \
            -v "$PWD/scripts:/work/scripts:ro" -w /work \
            -e DATABASE_URL postgres:17-alpine \
            sh scripts/verify-test-restore.sh

  gate:
    name: merge gate
    if: always()
    needs: [changes, fast, migration-guard, critical]
    runs-on: ubuntu-latest
    steps:
      - name: Enforce required outcomes
        env:
          CHANGES: ${{ needs.changes.result }}
          FAST: ${{ needs.fast.result }}
          MIGRATION: ${{ needs.migration-guard.result }}
          CRITICAL: ${{ needs.critical.result }}
        run: |
          set -euo pipefail
          [ "$CHANGES" = "success" ]
          [ "$FAST" = "success" ]
          [ "$MIGRATION" = "success" ]
          if [ "$CRITICAL" != "success" ] && [ "$CRITICAL" != "skipped" ]; then
            echo "::error::Critical integration checks did not pass."
            exit 1
          fi
          echo "All required merge gates passed."
