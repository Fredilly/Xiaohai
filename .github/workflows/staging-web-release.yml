name: Build immutable staging Store and HQ Web releases (CI verified)

on:
  workflow_run:
    workflows: ['CI']
    types: [completed]
    branches: [main]

permissions:
  contents: read

jobs:
  build-web-artifacts:
    if: >-
      ${{ github.event_name == 'workflow_run' &&
          github.event.workflow_run.conclusion == 'success' &&
          github.event.workflow_run.event == 'push' &&
          github.event.workflow_run.head_branch == 'main' &&
          github.event.workflow_run.head_repository.full_name == github.repository }}
    runs-on: ubuntu-latest
    strategy:
      matrix:
        site: [store-web, admin-web]
    env:
      VITE_API_BASE_URL: ''
      SOURCE_SHA: ${{ github.event.workflow_run.head_sha }}
    steps:
      - uses: actions/checkout@v4
        with:
          ref: ${{ github.event.workflow_run.head_sha }}
      - uses: pnpm/action-setup@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: pnpm
      - run: pnpm install --frozen-lockfile
      - run: pnpm exec turbo run build --filter="@xiaohai/${{ matrix.site }}" --env-mode=loose
      - name: Validate and mark immutable build from successful main CI
        run: |
          set -euo pipefail
          [[ "$SOURCE_SHA" =~ ^[0-9a-f]{40}$ ]]
          dist="apps/${{ matrix.site }}/dist"
          test -s "$dist/index.html"
          test "$(du -sm "$dist" | cut -f1)" -le 30
          test -z "$(find "$dist" -type l -print -quit)"
          printf '%s\n' "$SOURCE_SHA" > "$dist/.xiaohai-release-revision"
          test "$(cat "$dist/.xiaohai-release-revision")" = "$SOURCE_SHA"
      - uses: actions/upload-artifact@v4
        with:
          name: staging-${{ matrix.site }}-${{ github.event.workflow_run.head_sha }}
          path: apps/${{ matrix.site }}/dist/
          include-hidden-files: true
          if-no-files-found: error
          retention-days: 7
