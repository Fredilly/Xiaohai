name: xiaohai-staging
services:
  postgres:
    image: postgres:17-alpine
    restart: unless-stopped
    environment:
      POSTGRES_DB: ${POSTGRES_DB:?Set POSTGRES_DB}
      POSTGRES_USER: ${POSTGRES_USER:?Set POSTGRES_USER}
      POSTGRES_PASSWORD: ${POSTGRES_PASSWORD:?Set POSTGRES_PASSWORD}
    volumes:
      - postgres_data:/var/lib/postgresql/data
    healthcheck:
      test: ['CMD-SHELL', 'pg_isready -U ${POSTGRES_USER} -d ${POSTGRES_DB}']
      interval: 10s
      retries: 10
    networks: [private]
  redis:
    image: redis:7.4-alpine
    command: ['redis-server', '--appendonly', 'yes']
    restart: unless-stopped
    volumes:
      - redis_data:/data
    networks: [private]
  api:
    image: ghcr.io/fredilly/xiaohai-api:${REVISION:?Set REVISION}
    restart: unless-stopped
    env_file: staging.env
    depends_on:
      postgres:
        condition: service_healthy
      redis:
        condition: service_started
    networks: [private]
  worker:
    image: ghcr.io/fredilly/xiaohai-worker:${REVISION:?Set REVISION}
    restart: unless-stopped
    env_file: staging.env
    depends_on:
      postgres:
        condition: service_healthy
      redis:
        condition: service_started
    networks: [private]
  proxy:
    image: caddy:2-alpine
    restart: unless-stopped
    ports:
      - '80:80'
      - '443:443'
    volumes:
      - ./Caddyfile:/etc/caddy/Caddyfile:ro
      - caddy_data:/data
      - caddy_config:/config
    depends_on: [api]
    networks: [private]
networks:
  private:
volumes:
  postgres_data:
  redis_data:
  caddy_data:
  caddy_config:
