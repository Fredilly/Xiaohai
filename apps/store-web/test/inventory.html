<!doctype html>
<html lang="zh-CN">
  <head>
    <meta charset="UTF-8" />
    <title>Inventory interaction regression fixture</title>
  </head>
  <body>
    <div id="root"></div>
    <script type="module">
      import React from 'react';
      import { createRoot } from 'react-dom/client';
      import { InventoryPanel } from '../src/inventory-panel.tsx';
      import { StoreMeipingPreflightPanel } from '../src/store-meiping-preflight-panel.tsx';
      import { StoreProductImageUploader } from '../src/merchant-image-uploader.tsx';
      import { StoreCatalogPanel } from '../src/store-catalog-panel.tsx';
      import { RentalPanel } from '../src/rental-panel.tsx';
      const root = createRoot(document.getElementById('root'));
      window.addEventListener('inventory-props', ({ detail }) => {
        const selected = detail.rental
          ? RentalPanel
          : detail.gallery
            ? StoreProductImageUploader
            : detail.catalog
              ? StoreCatalogPanel
              : detail.preflight
                ? StoreMeipingPreflightPanel
                : InventoryPanel;
        root.render(
          React.createElement(
            selected,
            detail.gallery
              ? {
                  ...detail,
                  onUploaded: () => {
                    window.gallerySaved = true;
                  },
                  onCancel: () => {
                    window.galleryCancelled = true;
                  },
                }
              : detail,
          ),
        );
      });
      window.fixtureReady = true;
    </script>
  </body>
</html>
